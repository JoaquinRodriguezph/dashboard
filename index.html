<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="My personal dashboard" />
    <!-- Colors the browser/phone status bar. useTheme.ts updates it when the theme changes. -->
    <meta name="theme-color" content="#f3f6f9" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Dashboard</title>
    <script>
      // Runs before the page paints so dark mode never flashes white.
      // Reads the theme cache that src/storage.ts keeps in localStorage.
      try {
        var t = localStorage.getItem('dash.themeCache') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#0c1017')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
